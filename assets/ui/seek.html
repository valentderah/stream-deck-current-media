<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/pi.css" />
</head>

<body style="visibility: hidden;">
    <div class="sdpi-wrapper">
        <div class="sdpi-item">
            <label class="sdpi-item-label" data-i18n="Seconds">Seconds</label>
            <input class="sdpi-item-value" type="number" min="1" step="1"
                   data-setting="seconds" data-default="10" />
        </div>
    </div>

    <script src="js/pi.js"></script>
</body>

</html>
